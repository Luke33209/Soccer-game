<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Street Soccer 3D - AI</title>
<style>
html,body{margin:0;height:100%;background:#07110b;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
#game{position:relative;width:100vw;height:100vh;overflow:hidden}
canvas{width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:18px;align-items:center;background:rgba(5,10,8,.72);padding:9px 16px;border-radius:14px;color:white;font-weight:800;backdrop-filter:blur(7px);pointer-events:none}
#score{font-size:20px}.small{font-size:13px;opacity:.8}
#message{position:absolute;top:62px;left:50%;transform:translateX(-50%);color:white;background:rgba(0,0,0,.45);padding:6px 12px;border-radius:10px;font-weight:700;pointer-events:none}
#joy{position:absolute;left:22px;bottom:22px;width:122px;height:122px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);touch-action:none}
#knob{position:absolute;left:34px;top:34px;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.72)}
#buttons{position:absolute;right:18px;bottom:18px;display:flex;gap:10px;align-items:end}
button.ctrl{width:72px;height:72px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(10,10,10,.42);color:#fff;font-weight:900;font-size:11px;touch-action:none}
button.ctrl.big{width:84px;height:84px}
#restart{position:absolute;right:14px;top:14px;border:0;border-radius:10px;padding:8px 12px;background:rgba(0,0,0,.5);color:#fff;font-weight:800}
#help{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.65);font-size:11px;pointer-events:none}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>
<div id="hud"><span id="score">BLUE 0 — 0 RED</span><span id="clock">02:00</span><span class="small" id="pos">ST</span></div>
<div id="message">Win the ball. Use TACKLE to steal.</div>
<button id="restart">RESTART</button>
<div id="joy"><div id="knob"></div></div>
<div id="buttons">
<button class="ctrl" id="pass">PASS</button>
<button class="ctrl big" id="shoot">SHOOT</button>
<button class="ctrl" id="tackle">TACKLE</button>
<button class="ctrl" id="sprint">SPRINT</button>
</div>
<div id="help">WASD / arrows: move • Shift: sprint • Tackle: steal • Pass/Shoot when you have possession</div>
</div>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;
let dpr = Math.min(devicePixelRatio || 1, 2);

function resize() {
  W = innerWidth;
  H = innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

addEventListener("resize", resize);
resize();

const FIELD = { w: 105, h: 170, goalW: 20, goalD: 8 };

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function norm(x, y) {
  const n = Math.hypot(x, y) || 1;
  return { x: x / n, y: y / n };
}

function dot(a, b) {
  return a.x * b.x + a.y * b.y;
}

const state = {
  time: 120,
  blue: 0,
  red: 0,
  over: false,
  kickoff: 0,
  msg: "Win the ball. Use TACKLE to steal."
};

const user = {
  id: "U",
  team: "blue",
  role: "ST",
  x: 0,
  y: -55,
  vx: 0,
  vy: 0,
  dir: { x: 0, y: 1 },
  speed: 8.5,
  accel: 28,
  stamina: 100,
  hasBall: false,
  cool: 0,
  tackleCd: 0,
  stealWindow: 0,
  stats: { pace: 8, passing: 8, shooting: 8, defending: 7, awareness: 8 }
};

const teammates = [
  { id: "B2", team: "blue", role: "LW", x: -30, y: -5, vx: 0, vy: 0, dir: { x: 0, y: 1 }, speed: 7.4, stamina: 100, hasBall: false, cool: 0, tackleCd: 0, stats: { pace: 8, passing: 7, shooting: 7, defending: 5, awareness: 8 } },
  { id: "B3", team: "blue", role: "CM", x: 0, y: 4, vx: 0, vy: 0, dir: { x: 0, y: 1 }, speed: 7.0, stamina: 100, hasBall: false, cool: 0, tackleCd: 0, stats: { pace: 7, passing: 9, shooting: 6, defending: 7, awareness: 9 } },
  { id: "B4", team: "blue", role: "CB", x: 25, y: -12, vx: 0, vy: 0, dir: { x: 0, y: 1 }, speed: 6.2, stamina: 100, hasBall: false, cool: 0, tackleCd: 0, stats: { pace: 6, passing: 7, shooting: 3, defending: 9, awareness: 9 } }
];

const reds = [
  { id: "R1", team: "red", role: "ST", x: 0, y: 55, vx: 0, vy: 0, dir: { x: 0, y: -1 }, speed: 8, stamina: 100, hasBall: false, cool: 0, tackleCd: 0, stats: { pace: 9, passing: 7, shooting: 9, defending: 4, awareness: 8 } },
  { id: "R2", team: "red", role: "LW", x: -32, y: 12, vx: 0, vy: 0, dir: { x: 0, y: -1 }, speed: 7.2, stamina: 100, hasBall: false, cool: 0, tackleCd: 0, stats: { pace: 8, passing: 8, shooting: 7, defending: 5, awareness: 8 } },
  { id: "R3", team: "red", role: "CM", x: 0, y: 7, vx: 0, vy: 0, dir: { x: 0, y: -1 }, speed: 7.0, stamina: 100, hasBall: false, cool: 0, tackleCd: 0, stats: { pace: 7, passing: 8, shooting: 6, defending: 8, awareness: 9 } },
  { id: "R4", team: "red", role: "CB", x: 25, y: 15, vx: 0, vy: 0, dir: { x: 0, y: -1 }, speed: 6.2, stamina: 100, hasBall: false, cool: 0, tackleCd: 0, stats: { pace: 6, passing: 7, shooting: 3, defending: 9, awareness: 9 } },
  { id: "RGK", team: "red", role: "GK", x: 0, y: 78, vx: 0, vy: 0, dir: { x: 0, y: -1 }, speed: 5.2, stamina: 100, hasBall: false, cool: 0, tackleCd: 0, stats: { pace: 5, passing: 7, shooting: 2, defending: 10, awareness: 10 } }
];

const all = () => [user, ...teammates, ...reds];

const ball = {
  x: 0,
  y: 0,
  z: 0,
  vx: 0,
  vy: 0,
  vz: 0,
  owner: null,
  spin: 0,
  freeLock: 0
};

const keys = {};

addEventListener("keydown", event => {
  const key = event.key.toLowerCase();
  keys[key] = true;

  if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(key)) {
    event.preventDefault();
  }
});

addEventListener("keyup", event => {
  keys[event.key.toLowerCase()] = false;
});

const joy = { x: 0, y: 0, id: null };
const joyEl = document.getElementById("joy");
const knob = document.getElementById("knob");

function joyMove(event) {
  const rect = joyEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  let dx = event.clientX - cx;
  let dy = event.clientY - cy;
  const max = 38;
  const magnitude = Math.hypot(dx, dy);

  if (magnitude > max) {
    dx = dx / magnitude * max;
    dy = dy / magnitude * max;
  }

  joy.x = dx / max;
  joy.y = dy / max;
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
}

joyEl.onpointerdown = event => {
  joy.id = event.pointerId;
  joyEl.setPointerCapture(event.pointerId);
  joyMove(event);
};

joyEl.onpointermove = event => {
  if (event.pointerId === joy.id) joyMove(event);
};

function joyEnd(event) {
  if (event.pointerId !== joy.id) return;

  joy.id = null;
  joy.x = 0;
  joy.y = 0;
  knob.style.transform = "translate(0, 0)";
}

joyEl.onpointerup = joyEnd;
joyEl.onpointercancel = joyEnd;

let sprint = false;

document.getElementById("sprint").onpointerdown = () => {
  sprint = true;
};

document.getElementById("sprint").onpointerup = () => {
  sprint = false;
};

document.getElementById("sprint").onpointercancel = () => {
  sprint = false;
};

document.getElementById("pass").onpointerdown = pass;
document.getElementById("shoot").onpointerdown = shoot;
document.getElementById("tackle").onpointerdown = tackle;
document.getElementById("restart").onclick = restart;

function input() {
  let x = joy.x;
  let y = joy.y;

  if (keys.a || keys.arrowleft) x -= 1;
  if (keys.d || keys.arrowright) x += 1;
  if (keys.w || keys.arrowup) y -= 1;
  if (keys.s || keys.arrowdown) y += 1;

  const n = Math.hypot(x, y);
  return n > 1 ? { x: x / n, y: y / n } : { x, y };
}

function ownTeam(player) {
  return player.team === "blue" ? [user, ...teammates] : reds;
}

function oppTeam(player) {
  return player.team === "blue" ? reds : [user, ...teammates];
}

function setOwner(player) {
  if (ball.owner === player) return;

  for (const p of all()) p.hasBall = false;

  ball.owner = player;
  player.hasBall = true;
  ball.freeLock = 0.35;
  player.cool = 0.15;
}

function release(player, vx, vy, vz = 1.8) {
  if (!player.hasBall) return;

  player.hasBall = false;

  if (ball.owner === player) ball.owner = null;

  ball.x = player.x + player.dir.x * 1.5;
  ball.y = player.y + player.dir.y * 1.5;
  ball.z = 0.7;
  ball.vx = vx;
  ball.vy = vy;
  ball.vz = vz;
  ball.freeLock = 0.45;
}

function kickToward(player, tx, ty, power = 20, lift = 2.2) {
  const direction = norm(tx - player.x, ty - player.y);
  release(player, direction.x * power, direction.y * power, lift);
}

function passScore(player, teammate) {
  const direction = player.team === "blue" ? 1 : -1;
  const forward = (teammate.y - player.y) * direction;
  const nearestOpponent = oppTeam(player).reduce(
    (minimum, opponent) => Math.min(minimum, dist(teammate, opponent)),
    50
  );

  return forward * 1.8 + nearestOpponent * 1.1 - Math.abs(teammate.x) * 0.01;
}

function bestTeammate(player) {
  const teammatesForPlayer = ownTeam(player).filter(p => p !== player);

  let best = null;
  let bestScore = -Infinity;

  for (const teammate of teammatesForPlayer) {
    const score = passScore(player, teammate);

    if (score > bestScore) {
      bestScore = score;
      best = teammate;
    }
  }

  return best;
}

function pass() {
  if (!user.hasBall) return;

  const target = bestTeammate(user);
  if (!target) return;

  const direction = norm(target.x - user.x, target.y - user.y);
  release(user, direction.x * 18, direction.y * 18, 1.1);
  state.msg = "PASS — teammate selected";
}

function shoot() {
  if (!user.hasBall) return;

  const goalY = FIELD.h / 2 + 0.5;
  const targetX = clamp(user.x * 0.15, -FIELD.goalW * 0.42, FIELD.goalW * 0.42);
  const direction = norm(targetX - user.x, goalY - user.y);

  release(user, direction.x * 27, direction.y * 27, 4.5);
  state.msg = "SHOT!";
}

function tackle() {
  if (user.tackleCd > 0) return;

  user.tackleCd = 0.8;
  user.stealWindow = 0.28;

  const enemy = reds
    .filter(player => player.hasBall || ball.owner === player)
    .sort((a, b) => dist(user, a) - dist(user, b))[0];

  if (!enemy || dist(user, enemy) > 4.2) return;

  const facing = dot(user.dir, norm(enemy.x - user.x, enemy.y - user.y));

  if (facing > -0.25) {
    setOwner(user);
    state.msg = "CLEAN STEAL!";
  } else {
    const direction = norm(user.x - enemy.x, user.y - enemy.y);

    ball.owner = null;
    enemy.hasBall = false;
    ball.x = enemy.x + direction.x * 2;
    ball.y = enemy.y + direction.y * 2;
    ball.vx = direction.x * 7;
    ball.vy = direction.y * 7;
    ball.vz = 1.3;
    ball.freeLock = 0.5;

    state.msg = "TACKLE — loose ball!";
  }
}

function defensiveDecision(player) {
  const target = ball.owner && ball.owner.team !== player.team ? ball.owner : ball;
  const ownGoalY = player.team === "blue" ? -FIELD.h / 2 : FIELD.h / 2;
  const danger = Math.abs(target.y - ownGoalY);

  const attackers = oppTeam(player).filter(p => p !== ball.owner);

  const threat = attackers.sort(
    (a, b) => Math.abs(b.y - ownGoalY) - Math.abs(a.y - ownGoalY)
  )[0];

  if (player.role === "GK") {
    return {
      x: clamp(ball.x, -FIELD.goalW * 0.48, FIELD.goalW * 0.48),
      y: player.team === "red" ? FIELD.h / 2 - 5 : -FIELD.h / 2 + 5,
      mode: "GK"
    };
  }

  if (ball.owner && ball.owner.team !== player.team) {
    const carrier = ball.owner;
    const carrierDistance = dist(player, carrier);

    if (carrierDistance < 8) {
      return { x: carrier.x, y: carrier.y, mode: "PRESS" };
    }

    if (carrierDistance < 20 && danger > 35) {
      return {
        x: carrier.x + carrier.dir.x * 2,
        y: carrier.y + carrier.dir.y * 2,
        mode: "CONTAIN"
      };
    }

    if (threat && dist(player, threat) < 24) {
      return { x: threat.x, y: threat.y, mode: "MARK" };
    }

    return {
      x: carrier.x * 0.55,
      y: carrier.y * 0.72 + (player.team === "red" ? 5 : -5),
      mode: "COVER"
    };
  }

  if (ball.owner && ball.owner.team === player.team) {
    return {
      x: ball.owner.x + (player.role === "CB" ? player.x * 0.15 : 0),
      y: ball.owner.y + (player.team === "blue" ? 10 : -10),
      mode: "SUPPORT"
    };
  }

  return { x: target.x, y: target.y, mode: "TRACK" };
}

function mateSpace(player) {
  const goalY = player.team === "blue" ? FIELD.h / 2 : -FIELD.h / 2;
  const candidates = [-35, -18, 0, 18, 35].map(x => ({ x, y: goalY * 0.55 }));

  let best = candidates[0];
  let bestScore = -Infinity;

  for (const candidate of candidates) {
    const nearestOpponent = oppTeam(player).reduce(
      (minimum, opponent) => Math.min(minimum, dist(candidate, opponent)),
      99
    );

    let score = nearestOpponent * 0.35;
    score += (candidate.y - player.y) * (player.team === "blue" ? 1 : -1) * 0.6;

    if (Math.abs(candidate.x) > 42) score -= 8;

    if (score > bestScore) {
      bestScore = score;
      best = candidate;
    }
  }

  return best;
}

function attackingDecision(player) {
  const goalY = player.team === "blue" ? FIELD.h / 2 : -FIELD.h / 2;

  if (ball.owner === player) {
    const pressure = oppTeam(player).reduce(
      (minimum, opponent) => Math.min(minimum, dist(player, opponent)),
      99
    );

    if (Math.abs(goalY - player.y) < 38 && Math.abs(player.x) < 24) {
      return { x: 0, y: goalY, mode: "SHOOT" };
    }

    if (pressure < 7) {
      const target = bestTeammate(player);
      return { x: target ? target.x : player.x, y: target ? target.y : player.y, mode: "PASS" };
    }

    return { x: 0, y: goalY, mode: "CARRY" };
  }

  const best = mateSpace(player);
  return { x: best.x, y: best.y, mode: "RUN" };
}

function moveAI(player, target, dt, boost = 1) {
  const dx = target.x - player.x;
  const dy = target.y - player.y;
  const distance = Math.hypot(dx, dy);

  if (distance > 0.2) {
    player.dir.x = dx / distance;
    player.dir.y = dy / distance;
  }

  const desiredSpeed = player.speed * boost;

  player.vx += (player.dir.x * desiredSpeed - player.vx) * Math.min(1, dt * 6);
  player.vy += (player.dir.y * desiredSpeed - player.vy) * Math.min(1, dt * 6);

  player.x += player.vx * dt;
  player.y += player.vy * dt;

  player.x = clamp(player.x, -FIELD.w / 2 + 3, FIELD.w / 2 - 3);
  player.y = clamp(player.y, -FIELD.h / 2 + 2, FIELD.h / 2 - 2);
}

function aiLogic(player, dt) {
  player.cool = Math.max(0, player.cool - dt);
  player.tackleCd = Math.max(0, player.tackleCd - dt);

  if (player.hasBall) {
    const goalY = player.team === "blue" ? FIELD.h / 2 : -FIELD.h / 2;
    const goalDistance = Math.abs(goalY - player.y);

    const pressure = oppTeam(player).reduce(
      (minimum, opponent) => Math.min(minimum, dist(player, opponent)),
      99
    );

    if (goalDistance < 36 && Math.abs(player.x) < 25 && player.cool <= 0) {
      kickToward(player, 0, goalY, 26, 4);
      player.cool = 1.2;
      return;
    }

    if (pressure < 7 && player.cool <= 0) {
      const target = bestTeammate(player);

      if (target) {
        kickToward(player, target.x, target.y, 18, 1.2);
        player.cool = 0.8;
        return;
      }
    }

    const decision = attackingDecision(player);
    moveAI(player, decision, dt, pressure < 8 ? 1.05 : 1);
    return;
  }

  const decision = defensiveDecision(player);

  if (!ball.owner || ball.owner.team !== player.team) {
    const target = { x: decision.x, y: decision.y };
    const targetDistance = dist(player, target);

    moveAI(player, target, dt, targetDistance < 8 ? 1.08 : 1);
  } else {
    moveAI(player, decision, dt, 0.9);
  }

  if (!ball.owner && dist(player, ball) < 3.3 && ball.freeLock <= 0) {
    setOwner(player);
  }

  if (
    ball.owner &&
    ball.owner.team !== player.team &&
    dist(player, ball.owner) < 3 &&
    player.tackleCd <= 0
  ) {
    const carrier = ball.owner;
    const toCarrier = norm(carrier.x - player.x, carrier.y - player.y);

    if (dot(player.dir, toCarrier) > 0.15) {
      player.tackleCd = 0.9;
      setOwner(player);
      state.msg = player.team === "red" ? "RED WIN THE BALL" : "BLUE WIN THE BALL";
    }
  }
}

function userLogic(dt) {
  user.cool = Math.max(0, user.cool - dt);
  user.tackleCd = Math.max(0, user.tackleCd - dt);

  const movement = input();
  const movementLength = Math.hypot(movement.x, movement.y);

  if (movementLength > 0.1) {
    user.dir.x = movement.x;
    user.dir.y = movement.y;
  }

  const isSprinting = (sprint || keys.shift) && user.stamina > 3;
  const targetSpeed = user.speed * (isSprinting ? 1.55 : 1);

  if (isSprinting) {
    user.stamina = Math.max(0, user.stamina - 25 * dt);
  } else {
    user.stamina = Math.min(100, user.stamina + 13 * dt);
  }

  user.vx += (movement.x * targetSpeed - user.vx) * Math.min(1, dt * 10);
  user.vy += (movement.y * targetSpeed - user.vy) * Math.min(1, dt * 10);

  user.x += user.vx * dt;
  user.y += user.vy * dt;

  user.x = clamp(user.x, -FIELD.w / 2 + 3, FIELD.w / 2 - 3);
  user.y = clamp(user.y, -FIELD.h / 2 + 2, FIELD.h / 2 - 2);

  if (!ball.owner && !user.hasBall && dist(user, ball) < 3.1 && ball.freeLock <= 0) {
    setOwner(user);
  }

  if (user.hasBall) {
    ball.x = user.x + user.dir.x * 1.5;
    ball.y = user.y + user.dir.y * 1.5;
    ball.z = 0.55 + Math.abs(Math.sin(performance.now() / 100)) * 0.08;
  }
}

function physics(dt) {
  if (ball.owner) {
    ball.spin += dt * 9;
  } else {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    ball.z += ball.vz * dt;
    ball.vz -= 18 * dt;

    ball.vx *= Math.pow(0.1, dt);
    ball.vy *= Math.pow(0.1, dt);

    if (ball.z < 0) {
      ball.z = 0;
      ball.vz *= -0.38;
    }

    if (ball.y > FIELD.h / 2 + 5 && Math.abs(ball.x) < FIELD.goalW / 2) {
      score("blue");
      return;
    }

    if (ball.y < -FIELD.h / 2 - 5 && Math.abs(ball.x) < FIELD.goalW / 2) {
      score("red");
      return;
    }

    if (Math.abs(ball.x) > FIELD.w / 2) {
      ball.x = clamp(ball.x, -FIELD.w / 2, FIELD.w / 2);
      ball.vx *= -0.6;
    }

    if (ball.y > FIELD.h / 2 + 5 || ball.y < -FIELD.h / 2 - 5) {
      ball.vy *= -0.6;
    }
  }

  ball.freeLock = Math.max(0, ball.freeLock - dt);
}

function score(team) {
  if (team === "blue") {
    state.blue++;
  } else {
    state.red++;
  }

  state.msg = team === "blue" ? "GOAL BLUE!" : "GOAL RED!";

  for (const player of all()) {
    player.hasBall = false;
  }

  ball.owner = null;
  state.kickoff = 1.4;
  resetPositions();
}

function resetPositions() {
  user.x = 0;
  user.y = -55;
  user.vx = 0;
  user.vy = 0;

  teammates[0].x = -30;
  teammates[0].y = -8;

  teammates[1].x = 0;
  teammates[1].y = 0;

  teammates[2].x = 28;
  teammates[2].y = -8;

  reds[0].x = 0;
  reds[0].y = 55;

  reds[1].x = -30;
  reds[1].y = 8;

  reds[2].x = 0;
  reds[2].y = 5;

  reds[3].x = 28;
  reds[3].y = 14;

  reds[4].x = 0;
  reds[4].y = 76;

  ball.x = 0;
  ball.y = 0;
  ball.z = 0;
  ball.vx = 0;
  ball.vy = 0;
  ball.vz = 0;
  ball.freeLock = 1.4;
}

function restart() {
  state.time = 120;
  state.blue = 0;
  state.red = 0;
  state.over = false;
  state.kickoff = 1.2;
  state.msg = "Kickoff!";

  for (const player of all()) {
    player.hasBall = false;
    player.cool = 0;
    player.tackleCd = 0;
    player.stealWindow = 0;
    player.stamina = 100;
  }

  ball.owner = null;
  resetPositions();
}

function project(wx, wy, wz = 0) {
  const camY = user.y - 18;
  const camX = user.x * 0.55;
  const camZ = 8.5;
  const pitch = 0.48;

  const dx = wx - camX;
  const dy = wy - camY;
  const dz = wz - camZ;

  const depth = dy * Math.cos(pitch) - dz * Math.sin(pitch);

  if (depth < 1) return null;

  const vertical = dy * Math.sin(pitch) + dz * Math.cos(pitch);
  const focal = Math.min(W, H) * 0.82;

  return {
    x: W / 2 + dx * focal / depth,
    y: H * 0.38 - vertical * focal / depth,
    s: focal / depth,
    depth
  };
}

function poly(points, fill, stroke, lineWidth = 1) {
  ctx.beginPath();

  points.forEach((point, index) => {
    if (index) {
      ctx.lineTo(point.x, point.y);
    } else {
      ctx.moveTo(point.x, point.y);
    }
  });

  ctx.closePath();

  if (fill) {
    ctx.fillStyle = fill;
    ctx.fill();
  }

  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lineWidth;
    ctx.stroke();
  }
}

function lineWorld(points, stroke = "rgba(255,255,255,.8)", lineWidth = 2) {
  ctx.beginPath();

  let first = true;

  for (const point of points) {
    const projected = project(point.x, point.y, point.z || 0);

    if (!projected) continue;

    if (first) {
      ctx.moveTo(projected.x, projected.y);
      first = false;
    } else {
      ctx.lineTo(projected.x, projected.y);
    }
  }

  ctx.strokeStyle = stroke;
  ctx.lineWidth = lineWidth;
  ctx.stroke();
}

function circleWorld(cx, cy, radius, stroke) {
  const points = [];

  for (let i = 0; i <= 48; i++) {
    const angle = i / 48 * Math.PI * 2;

    points.push({
      x: cx + Math.cos(angle) * radius,
      y: cy + Math.sin(angle) * radius
    });
  }

  lineWorld(points, stroke, 2);
}

const crowd = Array.from({ length: 70 }, (_, i) => ({
  side: i % 2 ? -1 : 1,
  y: -78 + (i * 29) % 156,
  x: 58 + (i * 7) % 25,
  z: 1 + (i % 4) * 1.2,
  color: i % 3 ? "#d7d7d7" : "#ef5350"
}));

function renderField() {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#6aa7d8");
  sky.addColorStop(0.48, "#d7edf7");
  sky.addColorStop(0.49, "#15251a");
  sky.addColorStop(1, "#08130c");

  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  const nearLeft = project(-FIELD.w / 2, -FIELD.h / 2);
  const nearRight = project(FIELD.w / 2, -FIELD.h / 2);
  const farRight = project(FIELD.w / 2, FIELD.h / 2);
  const farLeft = project(-FIELD.w / 2, FIELD.h / 2);

  if (nearLeft && nearRight && farRight && farLeft) {
    poly([nearLeft, nearRight, farRight, farLeft], "#196b37");
  }

  for (let y = -80; y < 80; y += 10) {
    const a = project(-FIELD.w / 2, y);
    const b = project(FIELD.w / 2, y);
    const c = project(FIELD.w / 2, y + 10);
    const d = project(-FIELD.w / 2, y + 10);

    if (a && b && c && d) {
      poly(
        [a, b, c, d],
        (y / 10) % 2 === 0 ? "rgba(255,255,255,.025)" : "rgba(0,0,0,.035)"
      );
    }
  }

  lineWorld([
    { x: -FIELD.w / 2, y: -FIELD.h / 2 },
    { x: -FIELD.w / 2, y: FIELD.h / 2 }
  ]);

  lineWorld([
    { x: FIELD.w / 2, y: -FIELD.h / 2 },
    { x: FIELD.w / 2, y: FIELD.h / 2 }
  ]);

  lineWorld([
    { x: -FIELD.w / 2, y: 0 },
    { x: FIELD.w / 2, y: 0 }
  ]);

  circleWorld(0, 0, 15, "rgba(255,255,255,.9)");

  for (const goalY of [-FIELD.h / 2, FIELD.h / 2]) {
    const direction = goalY > 0 ? 1 : -1;

    lineWorld([
      { x: -35, y: goalY },
      { x: 35, y: goalY }
    ]);

    lineWorld([
      { x: -35, y: goalY },
      { x: -35, y: goalY - direction * 18 },
      { x: 35, y: goalY - direction * 18 },
      { x: 35, y: goalY }
    ]);

    lineWorld([
      { x: -18, y: goalY },
      { x: -18, y: goalY - direction * 8 },
      { x: 18, y: goalY - direction * 8 },
      { x: 18, y: goalY }
    ]);
  }

  for (const side of [-1, 1]) {
    const x0 = side * (FIELD.w / 2 + 8);
    const x1 = side * (FIELD.w / 2 + 32);

    const a = project(x0, -FIELD.h / 2);
    const b = project(x1, -FIELD.h / 2);
    const c = project(x1, FIELD.h / 2);
    const d = project(x0, FIELD.h / 2);

    if (a && b && c && d) {
      poly([a, b, c, d], "#313842", "#15191d", 2);
    }

    for (let row = 0; row < 5; row++) {
      const y = -FIELD.h / 2 + row * 10;

      const p1 = project(side * (FIELD.w / 2 + 10 + row * 2), y);
      const p2 = project(side * (FIELD.w / 2 + 29 + row * 2), y);

      if (p1 && p2) {
        ctx.strokeStyle = "rgba(210,220,230,.45)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
    }
  }

  for (const fan of crowd) {
    const p = project(fan.side * fan.x, fan.y, fan.z);

    if (p) {
      ctx.fillStyle = fan.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(1.3, p.s * 2), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  for (const goalY of [-FIELD.h / 2, FIELD.h / 2]) {
    const p1 = project(-FIELD.goalW / 2, goalY, 0);
    const p2 = project(FIELD.goalW / 2, goalY, 0);
    const h1 = project(-FIELD.goalW / 2, goalY, 8);
    const h2 = project(FIELD.goalW / 2, goalY, 8);

    if (p1 && p2 && h1 && h2) {
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(h1.x, h1.y);
      ctx.lineTo(h2.x, h2.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();

      for (let k = 1; k < 6; k++) {
        const t = k / 6;

        ctx.strokeStyle = "rgba(255,255,255,.35)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(
          p1.x + (h1.x - p1.x) * t,
          p1.y + (h1.y - p1.y) * t
        );
        ctx.lineTo(
          p2.x + (h2.x - p2.x) * t,
          p2.y + (h2.y - p2.y) * t
        );
        ctx.stroke();
      }
    }
  }
}

function drawPlayer(player) {
  const foot = project(player.x, player.y, 0);
  const head = project(player.x, player.y, 3.1);

  if (!foot || !head) return;

  const size = Math.max(0.35, foot.s * 13);

  ctx.fillStyle = "rgba(0,0,0,.28)";
  ctx.beginPath();
  ctx.ellipse(foot.x, foot.y, size * 1.25, size * 0.45, 0, 0, Math.PI * 2);
  ctx.fill();

  const color = player.team === "blue" ? "#2378ff" : "#e43d4c";

  ctx.strokeStyle = "rgba(0,0,0,.5)";
  ctx.lineWidth = 1;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(foot.x, foot.y - size * 0.9, size * 0.72, size * 1.05, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#dca77d";
  ctx.beginPath();
  ctx.arc(head.x, head.y, size * 0.42, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#171717";
  ctx.beginPath();
  ctx.arc(head.x, head.y - size * 0.15, size * 0.43, Math.PI, Math.PI * 2);
  ctx.fill();

  if (player === user) {
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(foot.x, foot.y - size * 0.5, size * 1.15, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.fillStyle = "#fff";
  ctx.font = `bold ${Math.max(8, size * 0.55)}px system-ui`;
  ctx.textAlign = "center";
  ctx.fillText(player.role, foot.x, foot.y + size * 1.5);
}

function drawBall() {
  const p = project(ball.x, ball.y, ball.z);
  const ground = project(ball.x, ball.y, 0);

  if (!p || !ground) return;

  const radius = Math.max(2.5, p.s * 4.2);

  ctx.fillStyle = "rgba(0,0,0,.25)";
  ctx.beginPath();
  ctx.ellipse(ground.x, ground.y, radius * 1.25, radius * 0.42, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#222";
  ctx.lineWidth = 1;
  ctx.stroke();
}

function render() {
  ctx.clearRect(0, 0, W, H);
  renderField();

  const objects = all()
    .map(player => ({
      player,
      depth: project(player.x, player.y, 0)?.depth || 0
    }))
    .sort((a, b) => b.depth - a.depth);

  for (const object of objects) {
    drawPlayer(object.player);
  }

  drawBall();

  ctx.fillStyle = "rgba(0,0,0,.5)";
  ctx.fillRect(14, 14, 130, 8);

  ctx.fillStyle = "#70e070";
  ctx.fillRect(14, 14, 130 * (user.stamina / 100), 8);
}

function updateHUD() {
  document.getElementById("score").textContent = `BLUE ${state.blue} — ${state.red} RED`;

  const time = Math.ceil(state.time);

  document.getElementById("clock").textContent =
    `${String(Math.floor(time / 60)).padStart(2, "0")}:${String(time % 60).padStart(2, "0")}`;

  document.getElementById("pos").textContent = user.hasBall
    ? "ST • POSSESSION"
    : `ST • ${Math.round(user.stamina)}%`;

  document.getElementById("message").textContent = state.msg;
}

function update(dt) {
  if (state.over) {
    updateHUD();
    return;
  }

  state.time = Math.max(0, state.time - dt);

  if (state.time <= 0) {
    state.over = true;

    if (state.blue === state.red) {
      state.msg = "FULL TIME — DRAW";
    } else {
      state.msg = state.blue > state.red ? "FULL TIME — BLUE" : "FULL TIME — RED";
    }

    updateHUD();
    return;
  }

  state.kickoff = Math.max(0, state.kickoff - dt);

  if (state.kickoff <= 0) {
    userLogic(dt);

    for (const teammate of teammates) {
      aiLogic(teammate, dt);
    }

    for (const opponent of reds) {
      aiLogic(opponent, dt);
    }

    physics(dt);
  }

  updateHUD();
}

let last = performance.now();

function loop(now) {
  const dt = Math.min(0.035, (now - last) / 1000);
  last = now;

  update(dt);
  render();

  requestAnimationFrame(loop);
}

restart();
requestAnimationFrame(loop);
</script>
</body>
</html>
